<title>小吉罐頭的賺錢日記</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: four columns like a desktop task app (nav rail · lists · tasks · detail); on phones the rail becomes a bottom bar, lists slide in as a drawer, detail opens as a sheet. */
:root {
  --bg: #f7f8f7;
  --side: #eff2f0;
  --surface: #ffffff;
  --hover: #eef2ef;
  --sel: #e3efe9;
  --line: #e0e5e2;
  --fg: #1a2420;
  --muted: #69756f;
  --accent: #13795b;
  --accent-soft: #dcefe6;
  --on-accent: #ffffff;
  --p3: #d6453d;
  --p2: #db8f12;
  --p1: #3b7bd6;
  --p0: #a4ada8;
  --late: #d6453d;
  --shadow: 0 1px 2px rgba(20,36,30,.06), 0 4px 14px rgba(20,36,30,.06);
  --f-ui: "Manrope", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131715; --side: #171c19; --surface: #1b211e; --hover: #222a26; --sel: #1e3329;
    --line: #2b3430; --fg: #e3e9e5; --muted: #8e9a94; --accent: #4fc497; --accent-soft: #1c3a2e; --on-accent: #0f1a15;
    --p3: #f0716a; --p2: #f0b24a; --p1: #6fa6f0; --p0: #5f6a65; --late: #f0716a;
    --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131715; --side: #171c19; --surface: #1b211e; --hover: #222a26; --sel: #1e3329;
  --line: #2b3430; --fg: #e3e9e5; --muted: #8e9a94; --accent: #4fc497; --accent-soft: #1c3a2e; --on-accent: #0f1a15;
  --p3: #f0716a; --p2: #f0b24a; --p1: #6fa6f0; --p0: #5f6a65; --late: #f0716a;
  --shadow: 0 1px 2px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); font-size: 14px; line-height: 1.5; margin: 0; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.ic { flex: none; display: block; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app { display: flex; height: 100%; }

/* Rail */
.rail { width: 64px; flex: none; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding-block: 14px; }
.logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; margin-bottom: 12px; }
.rail-btn { width: 52px; border: 0; background: none; border-radius: 10px; padding: 7px 0 5px; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: 11px; position: relative; }
.rail-btn:hover { background: var(--hover); color: var(--fg); }
.rail-btn[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.rail-btn .live { position: absolute; top: 5px; right: 11px; width: 7px; height: 7px; border-radius: 50%; background: var(--p3); }

/* Side lists */
.side { width: 248px; flex: none; background: var(--side); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px 24px; display: flex; flex-direction: column; gap: 2px; }
.side-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 8px 4px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.nav-row { display: flex; align-items: center; border-radius: 8px; }
.nav-row:hover { background: var(--hover); }
.nav-row.active { background: var(--sel); }
.nav-item { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 7px 8px; text-align: left; border-radius: 8px; color: var(--fg); }
.nav-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item .count { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.nav-item .ic { color: var(--muted); }
.nav-row.active .nav-item .ic { color: var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; margin: 0 4px; }
.row-edit { opacity: 0; border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 6px; }
.nav-row:hover .row-edit, .row-edit:focus-visible { opacity: 1; }
.icon-btn { border: 0; background: none; color: var(--muted); padding: 5px; border-radius: 7px; display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.example-note { margin: 16px 6px 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 12.5px; display: grid; gap: 6px; }
.example-note button { justify-self: start; border: 0; background: none; color: var(--accent); font-weight: 700; padding: 0; }
.sync { padding: 12px 8px 0; font-size: 11.5px; color: var(--muted); }

/* Main */
.main { flex: 1; min-width: 0; overflow-y: auto; }
.view { padding: 20px 24px 40px; max-width: 920px; margin: 0 auto; display: grid; gap: 14px; align-content: start; }
.vh { display: flex; align-items: center; gap: 10px; }
.vh h1 { font-size: 21px; font-weight: 800; margin: 0; letter-spacing: -.01em; flex: 1; min-width: 0; overflow-wrap: anywhere; text-wrap: balance; }
.menu-btn { display: none; }

/* Quick add */
.qa { position: relative; }
.qa input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 14px 11px 40px; outline: none; }
.qa input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.qa .ic { position: absolute; left: 13px; top: 13px; color: var(--accent); }
.qa-hint { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; align-items: center; font-size: 12px; color: var(--muted); padding-left: 2px; }
.tok { background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 1px 7px; font-weight: 600; }

/* Task rows */
.group { display: grid; gap: 1px; }
.group-h { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--muted); padding: 10px 6px 4px; border: 0; background: none; text-align: left; }
.group-h .n { font-weight: 500; font-family: var(--f-mono); }
.group-h.late { color: var(--late); }
.group-h.now { color: var(--accent); }
.group-h.alldone { color: var(--accent); }
.done-fold { border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 6px 10px; text-align: left; border-radius: 8px; display: flex; gap: 6px; align-items: center; width: 100%; }
.done-fold:hover { background: var(--hover); color: var(--fg); }
.done-fold .ar { width: 12px; display: inline-block; }
.composer { display: grid; gap: 8px; }
.comp-body { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.comp-row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; }
.ctl { display: grid; gap: 5px; font-size: 12px; color: var(--muted); min-width: 0; }
.ctl > span { font-weight: 700; letter-spacing: .05em; font-size: 11px; }
.ctl input[type=date], .ctl input[type=time] { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 6px 8px; color: var(--fg); font-size: 13px; }
.ctl select { width: auto; min-width: 140px; color: var(--fg); font-size: 13px; padding: 6px 8px; }
.ctl .prio-pick { height: 33px; align-items: center; }
.tag-sug { border: 1px dashed var(--line); background: none; color: var(--muted); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
.tag-sug:hover { border-color: var(--accent); color: var(--accent); }
#c-tags input { font-size: 13px; }
#c-notes { resize: vertical; min-height: 42px; color: var(--fg); }
.comp-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.comp-foot .r { display: flex; gap: 8px; margin-left: auto; }
.group-h .range { font-weight: 500; }
.group-h .pill { margin-left: auto; font-weight: 600; font-size: 11.5px; padding: 1px 8px; border-radius: 999px; background: var(--hover); color: var(--muted); font-family: var(--f-mono); }
.group-h.now .pill { background: var(--accent-soft); color: var(--accent); }
.group-h .now-tag { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 0 8px; font-size: 11px; }
.group.past .task-title { opacity: .85; }
.brand { padding: 4px 8px 14px; font-family: "Noto Sans TC", var(--f-ui); font-weight: 900; font-size: 17px; letter-spacing: .02em; line-height: 1.3; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--p2); flex: none; }
.side-link { border: 0; background: none; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; display: flex; gap: 6px; align-items: center; }
.side-link:hover { color: var(--fg); }
.side-link.active { color: var(--accent); }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 8px; cursor: pointer; border-bottom: 1px solid transparent; }
.task:hover { background: var(--hover); }
.task.sel { background: var(--sel); }
.cb { width: 18px; height: 18px; margin-top: 1px; border-radius: 5px; border: 2px solid var(--pc, var(--p0)); background: transparent; padding: 0; display: grid; place-items: center; color: transparent; flex: none; transition: background .15s, color .15s; }
.cb:hover { background: color-mix(in srgb, var(--pc, var(--p0)) 15%, transparent); }
.cb svg { width: 12px; height: 12px; }
.is-done .cb, .cb.on { background: var(--pc, var(--p0)); color: var(--surface); }
.task.is-done .cb { --pc: var(--p0); }
.task-title { overflow-wrap: anywhere; }
.task.is-done .task-title { color: var(--muted); text-decoration: line-through; }
.task-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; margin-top: 3px; font-size: 12px; color: var(--muted); }
.task-meta span { display: inline-flex; align-items: center; gap: 3px; }
.chip-tag { background: var(--hover); color: var(--muted); border-radius: 5px; padding: 0 6px; }
.task-right { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; white-space: nowrap; padding-top: 1px; }
.due.late { color: var(--late); font-weight: 600; }
.task-del { border: 0; background: none; color: var(--muted); padding: 3px; margin: -3px -4px -3px 0; border-radius: 6px; display: inline-grid; place-items: center; opacity: 0; }
.task:hover .task-del, .task-del:focus-visible { opacity: 1; }
.task-del:hover { color: var(--p3); background: color-mix(in srgb, var(--p3) 12%, transparent); }
@media (hover: none) { .task-del { opacity: .7; } }
.due.today { color: var(--accent); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; display: grid; justify-items: center; gap: 10px; }
.empty .ic { color: var(--line); }

/* Detail */
.detail { width: 380px; flex: none; border-left: 1px solid var(--line); background: var(--surface); overflow-y: auto; }
.d-wrap { padding: 14px 18px 28px; display: grid; gap: 14px; }
.d-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.d-top input[type=date], .d-top input[type=time] { border: 1px solid var(--line); border-radius: 7px; background: var(--bg); padding: 4px 6px; font-size: 13px; }
.d-top .grow { flex: 1; }
.d-back { display: none; }
.prio-pick { display: flex; gap: 2px; }
.prio-pick button { border: 0; background: none; color: var(--pc); padding: 4px; border-radius: 6px; opacity: .5; }
.prio-pick button[aria-pressed="true"] { opacity: 1; background: var(--hover); }
.prio-pick button:hover { opacity: 1; }
.d-title { font-size: 19px; font-weight: 700; border: 0; background: none; width: 100%; padding: 2px 0; outline: none; }
.d-notes { border: 0; background: none; width: 100%; resize: none; min-height: 70px; outline: none; color: var(--fg); line-height: 1.6; }
.d-label { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .04em; display: flex; justify-content: space-between; }
.d-sec { display: grid; gap: 6px; }
.prog { height: 4px; border-radius: 2px; background: var(--hover); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); }
.sub { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 2px 0; }
.sub .cb { width: 15px; height: 15px; border-width: 1.5px; margin: 0; --pc: var(--muted); }
.sub input { border: 0; background: none; outline: none; padding: 3px 0; width: 100%; }
.sub.done input { text-decoration: line-through; color: var(--muted); }
.line-input { border: 0; border-bottom: 1px dashed var(--line); background: none; padding: 6px 0; width: 100%; outline: none; }
.line-input:focus { border-bottom-color: var(--accent); }
.tags-edit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag-chip { display: inline-flex; align-items: center; gap: 2px; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 2px 4px 2px 8px; font-size: 12.5px; font-weight: 600; }
.tag-chip button { border: 0; background: none; color: inherit; padding: 0 2px; display: grid; }
.tags-edit input { border: 0; background: none; outline: none; min-width: 80px; flex: 1; padding: 3px 0; }
.d-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
select, .input { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 7px 9px; width: 100%; min-width: 0; }
.d-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; }
.d-foot .acts { display: flex; gap: 6px; }
.d-empty { height: 100%; display: grid; place-content: center; justify-items: center; gap: 10px; color: var(--muted); padding: 24px; text-align: center; }
.d-empty .ic { color: var(--line); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--p3); }
.btn.danger.armed { background: var(--p3); border-color: var(--p3); color: var(--surface); }
.btn.big { padding: 10px 22px; font-size: 15px; border-radius: 999px; }

/* Calendar */
.cal-nav { display: flex; gap: 4px; }
.cal { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal-wd { padding: 8px; font-size: 12px; color: var(--muted); font-weight: 700; text-align: center; border-bottom: 1px solid var(--line); background: var(--bg); }
.cell { min-height: 96px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; min-width: 0; }
.cell:nth-child(7n) { border-right: 0; }
.cell:hover { background: var(--hover); }
.cell.other { background: var(--bg); }
.cell.other .dn { color: var(--muted); opacity: .6; }
.cell.picked { box-shadow: inset 0 0 0 2px var(--accent); }
.dn { font-size: 12.5px; font-weight: 700; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; font-family: var(--f-mono); }
.cell.today .dn { background: var(--accent); color: var(--on-accent); }
.cchip { font-size: 11.5px; border-radius: 4px; padding: 1px 5px; background: color-mix(in srgb, var(--pc) 16%, transparent); border-left: 3px solid var(--pc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cchip.done { opacity: .5; text-decoration: line-through; }
.cmore { font-size: 11px; color: var(--muted); padding-left: 4px; }
.cdots { display: none; gap: 3px; justify-content: center; flex-wrap: wrap; }
.cdots i { width: 5px; height: 5px; border-radius: 50%; background: var(--pc); }
.agenda { display: grid; gap: 8px; }

/* Matrix */
.matrix { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.quad { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 230px; min-width: 0; }
.quad.drag-over { box-shadow: inset 0 0 0 2px var(--qc); }
.quad-h { display: flex; align-items: center; gap: 8px; font-weight: 800; color: var(--qc); }
.quad-h small { color: var(--muted); font-weight: 500; margin-left: auto; font-family: var(--f-mono); }
.quad .qlist { display: grid; gap: 1px; flex: 1; align-content: start; }
.quad .qa input { padding: 7px 10px; font-size: 13px; border-radius: 8px; }

/* Dialog */
dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--fg); width: min(400px, calc(100vw - 32px)); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10,18,14,.45); }
dialog form { padding: 20px; display: grid; gap: 14px; }
dialog h2 { margin: 0; font-size: 17px; }
.colors { display: flex; gap: 8px; flex-wrap: wrap; }
.colors button { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.colors button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }
.dlg-actions { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dlg-actions .r { display: flex; gap: 8px; margin-left: auto; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 50; max-width: calc(100vw - 32px); display: flex; gap: 12px; align-items: center; }
.toast button { border: 0; background: none; color: var(--accent-soft); font-weight: 700; padding: 0; }
.scrim { position: fixed; inset: 0; background: rgba(10,18,14,.4); z-index: 30; }

/* Responsive */
@media (max-width: 1080px) {
  .detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 40; box-shadow: -8px 0 30px rgba(0,0,0,.18); transform: translateX(105%); transition: transform .22s ease; padding-top: env(safe-area-inset-top, 0px); }
  .app.detail-open .detail { transform: none; }
  .d-back { display: inline-grid; }
}
@media (max-width: 760px) {
  .app { flex-direction: column; }
  .rail { order: 3; width: 100%; flex-direction: row; justify-content: space-around; border-right: 0; border-top: 1px solid var(--line); padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px)); }
  .logo { display: none; }
  .main { order: 1; flex: 1; }
  .side { position: fixed; top: 0; left: 0; bottom: 0; z-index: 35; transform: translateX(-105%); transition: transform .22s ease; width: min(280px, 86vw); padding-top: calc(14px + env(safe-area-inset-top, 0px)); }
  .app.side-open .side { transform: none; }
  .menu-btn { display: inline-grid; }
  .view { padding: 14px 16px 28px; }
  .cell { min-height: 54px; align-items: center; }
  .cchip, .cmore { display: none; }
  .cdots { display: flex; }
  .matrix { grid-template-columns: minmax(0, 1fr); }
}
@media (min-width: 761px) { .side.hidden-wide { display: none; } }
@media (prefers-reduced-motion: reduce) { .detail, .side, .ring .prg, .cb { transition: none; } }
</style>

<div class="app" id="app">
  <nav class="rail" aria-label="Main">
    <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4 4 10-10"/></svg></div>
    <button class="rail-btn" data-go="tasks" id="go-tasks"></button>
    <button class="rail-btn" data-go="calendar" id="go-calendar"></button>
    <button class="rail-btn" data-go="matrix" id="go-matrix"></button>
  </nav>

  <aside class="side" id="side" aria-label="Lists"></aside>

  <main class="main" id="main">
    <!-- Tasks -->
    <section class="view" id="view-tasks" hidden>
      <div class="vh">
        <button class="icon-btn menu-btn" data-open-side aria-label="Open lists"></button>
        <h1 id="list-title">Today</h1>
        <button class="icon-btn" id="toggle-done" title="Show or hide completed tasks"></button>
      </div>
      <div class="composer" id="composer">
        <form class="qa" id="qa-form" autocomplete="off">
          <span id="qa-ic"></span>
          <input id="qa" type="text" placeholder="Add a task, e.g. HW2 next fri 11:59pm #homework !high" aria-label="Task name">
        </form>
        <div class="comp-body" id="comp-body" hidden>
          <div class="comp-row">
            <label class="ctl"><span>DATE</span><input type="date" id="c-due"></label>
            <label class="ctl"><span>TIME</span><input type="time" id="c-time"></label>
            <div class="ctl"><span>PRIORITY</span><div class="prio-pick" id="c-prio" role="group" aria-label="Priority"></div></div>

            <label class="ctl"><span>REPEAT</span><select id="c-repeat"></select></label>
          </div>

        </div>

      <div id="task-list"></div>

    <!-- Calendar -->

      <div class="vh">
        <h1 id="cal-title"></h1>
        <div class="cal-nav">
          <button class="icon-btn" id="cal-prev" aria-label="Previous month"></button>
          <button class="btn" id="cal-today">Today</button>
          <button class="icon-btn" id="cal-next" aria-label="Next month"></button>

      <div class="cal"><div class="cal-grid" id="cal-grid"></div></div>

        <div class="vh"><h1 id="agenda-title" style="font-size:16px"></h1></div>

          <span class="qa-ic"></span>
          <input id="cal-qa" type="text" placeholder="Add a task to this day" aria-label="Add a task to the selected day">

    <!-- Matrix -->
    <section class="view" id="view-matrix" hidden>
      <div class="vh"><h1>Eisenhower Matrix</h1><span class="muted" style="font-size:12.5px">Sorted by priority. Drag a task to another quadrant.</span></div>
      <div class="matrix" id="matrix">
        <div class="quad" data-quad="3" style="--qc:var(--p3)"><div class="quad-h">Urgent &amp; important<small data-qcount="3"></small></div><div class="qlist" data-qlist="3"></div><form class="qa" data-qa-prio="3" autocomplete="off"><input id="qa-q3" type="text" placeholder="+ Add" aria-label="Add to urgent and important"></form></div>
        <div class="quad" data-quad="2" style="--qc:var(--p2)"><div class="quad-h">Important, not urgent<small data-qcount="2"></small></div><div class="qlist" data-qlist="2"></div><form class="qa" data-qa-prio="2" autocomplete="off"><input id="qa-q2" type="text" placeholder="+ Add" aria-label="Add to important, not urgent"></form></div>
        <div class="quad" data-quad="1" style="--qc:var(--p1)"><div class="quad-h">Urgent, not important<small data-qcount="1"></small></div><div class="qlist" data-qlist="1"></div><form class="qa" data-qa-prio="1" autocomplete="off"><input id="qa-q1" type="text" placeholder="+ Add" aria-label="Add to urgent, not important"></form></div>
        <div class="quad" data-quad="0" style="--qc:var(--muted)"><div class="quad-h">Neither<small data-qcount="0"></small></div><div class="qlist" data-qlist="0"></div><form class="qa" data-qa-prio="0" autocomplete="off"><input id="qa-q0" type="text" placeholder="+ Add" aria-label="Add to neither urgent nor important"></form></div>
      </div>
    </section>

  </main>

  <section class="detail" id="detail" aria-label="Task details"></section>

<dialog id="list-dlg">
  <form id="list-form">
    <h2 id="list-dlg-title">New list</h2>
    <div class="field"><label for="l-name">Name</label><input class="input" id="l-name" type="text" required maxlength="40"></div>
    <div class="field"><label>Color</label><div class="colors" id="l-colors"></div></div>
    <div class="field"><label for="l-group">Section (optional)</label><input class="input" id="l-group" type="text" list="group-opts" maxlength="40" placeholder="e.g. 2026 Fall"><datalist id="group-opts"></datalist></div>
    <div class="field"><label for="l-week">Week 1 starts on (optional)</label><input class="input" id="l-week" type="date"><span class="muted" style="font-size:12px">Set this to group the list's tasks by week, like a course syllabus.</span></div>
    <div class="dlg-actions"><button type="button" class="btn danger" id="l-del">Delete list</button><div class="r"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div></div>
  </form>
</dialog>
<div class="toast" id="toast" hidden><span id="toast-msg"></span><button id="toast-act" hidden></button></div>

<script>
(() => {
  const LS_DATA = "tick-data-v1", LS_UI = "tick-ui-v1";
  const COLORS = ["#13795b", "#3b7bd6", "#d6453d", "#db8f12", "#8b5cc4", "#c2477e", "#2b8c95", "#6b7570"];
  const PRI = [{ v: 3, n: "High", c: "var(--p3)" }, { v: 2, n: "Medium", c: "var(--p2)" }, { v: 1, n: "Low", c: "var(--p1)" }, { v: 0, n: "None", c: "var(--p0)" }];
  const priColor = v => ["var(--p0)", "var(--p1)", "var(--p2)", "var(--p3)"][v || 0];
  const REPEAT = { "": "Does not repeat", daily: "Daily", weekdays: "Every weekday", weekly: "Weekly", monthly: "Monthly", yearly: "Yearly" };
  const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MO = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  // ---------- icons ----------
  const I = {
    tasks: '<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><path d="m8 12 3 3 5-6"/>',
    calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
    matrix: '<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>',
    focus: '<circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 2M9.5 3h5"/>',
    habits: '<path d="M12 21c4 0 7-2.8 7-6.8 0-3.6-2.6-6-4.2-8.7-.6 2-1.6 3.2-3 3.7C11.7 7 11 4.6 9 3c.2 3.2-4 5.6-4 11.2C5 18.2 8 21 12 21Z"/>',
    inbox: '<path d="M3.5 13.5 6 5h12l2.5 8.5V19a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19z"/><path d="M3.5 13.5H8l1.5 2.5h5l1.5-2.5h4.5"/>',
    today: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
    tomorrow: '<path d="M3 18h18M7 18a5 5 0 0 1 10 0M12 5v4M5.5 10.5 7 12M18.5 10.5 17 12"/>',
    week: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M10 13.5h4l-2.5 4.5"/>',
    all: '<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
    done: '<circle cx="12" cy="12" r="8.5"/><path d="m8 12 3 3 5-6"/>',
    tag: '<path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1.5 1.5 0 0 1 0 2.1l-6.2 6.2a1.5 1.5 0 0 1-2.1 0z"/><path d="M8 8h.01"/>',
    plus: '<path d="M12 5v14M5 12h14"/>', menu: '<path d="M4 7h16M4 12h16M4 17h16"/>', x: '<path d="m6 6 12 12M18 6 6 18"/>',
    trash: '<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13"/>', flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
    repeat: '<path d="m17 3 3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/>',
    back: '<path d="M15 5 8 12l7 7"/>', left: '<path d="M15 6l-6 6 6 6"/>', right: '<path d="m9 6 6 6-6 6"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>', eye: '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.8"/>',
    note: '<path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M9 11h6M9 15h6"/>', sub: '<path d="M5 4v9a3 3 0 0 0 3 3h11M15 12l4 4-4 4"/>',
  };
  const ic = (n, s = 18, w = 1.8) => `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
  const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>`;

  // ---------- helpers ----------
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => ymd(new Date());
  const parseD = s => new Date(s + "T00:00:00");
  const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
  const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 864e5);
  const fmtMD = s => { const d = parseD(s); return `${MO[d.getMonth()]} ${d.getDate()}`; };
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  function fmtTime(hm) { if (!hm) return ""; let [h, m] = hm.split(":").map(Number); const ap = h < 12 ? "AM" : "PM"; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; }
  function fmtDue(t) {
    if (!t.due) return "";
    const d = diffDays(t.due, today()), x = parseD(t.due);
    const s = d === 0 ? "Today" : d === 1 ? "Tomorrow" : d === -1 ? "Yesterday" : d > 1 && d < 7 ? WD[x.getDay()]
      : `${MO[x.getMonth()]} ${x.getDate()}${x.getFullYear() !== new Date().getFullYear() ? ", " + x.getFullYear() : ""}`;
    return t.time ? `${s}, ${fmtTime(t.time)}` : s;
  }
  function nextDue(due, rep) {
    const d = parseD(due);
    if (rep === "daily") d.setDate(d.getDate() + 1);
    else if (rep === "weekly") d.setDate(d.getDate() + 7);
    else if (rep === "weekdays") { do d.setDate(d.getDate() + 1); while (d.getDay() === 0 || d.getDay() === 6); }
    else if (rep === "monthly" || rep === "yearly") {
      const day = d.getDate(); d.setDate(1);
      if (rep === "monthly") d.setMonth(d.getMonth() + 1); else d.setFullYear(d.getFullYear() + 1);
      d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate()));
    }
    return ymd(d);
  }

  // ---------- store ----------
  const S = { lists: {}, tasks: {} };
  const COLLS = Object.keys(S);
  let db = null, loaded = false, syncNote = "";
  const all = c => Object.values(S[c]);
  const pend = {}, pendT = {};

  function persistLocal() { if (!db) lsSet(LS_DATA, S); }
  async function save(coll, obj) {
    S[coll][obj.id] = obj; render();
    if (db) {
      const { id, ...body } = obj;
      try { await db.collection(coll).doc(id).set(body); }
      catch (e) { toast(e?.code === "quota_exceeded" ? "Storage is full. Delete some completed tasks and try again." : "Couldn't save. Check your connection and try again."); }
    } else persistLocal();
  }
  async function remove(coll, id) {
    delete S[coll][id]; render();
    if (db) { try { await db.collection(coll).doc(id).delete(); } catch { toast("Couldn't delete. Try again in a moment."); } }
    else persistLocal();
  }
  function patchTask(id, patch, delay = 0) {
    const t = S.tasks[id]; if (!t) return;
    S.tasks[id] = { ...t, ...patch };
    if (delay) {
      pend[id] = { ...(pend[id] || {}), ...patch };
      clearTimeout(pendT[id]); pendT[id] = setTimeout(() => flush(id), delay);
      render({ skipDetail: true });
    } else { clearTimeout(pendT[id]); delete pend[id]; delete pendT[id]; save("tasks", S.tasks[id]); }
  }
  function flush(id) { if (!pend[id]) return; clearTimeout(pendT[id]); delete pend[id]; delete pendT[id]; if (S.tasks[id]) save("tasks", S.tasks[id]); }

  async function initStore() {
    let ns = null;
    try { if (window.claude?.use) ns = await window.claude.use("db"); } catch { ns = null; }
    if (!ns) {
      const d = lsGet(LS_DATA); if (d) COLLS.forEach(c => S[c] = d[c] || {});
      loaded = true; syncNote = "Saved in this browser."; render(); return;
    }
    db = ns; syncNote = "Synced to the cloud. Open it on any device.";
    let waiting = COLLS.length;
    COLLS.forEach(c => {
      let first = true;
      db.collection(c).onSnapshot(snap => {
        const next = {};
        snap.docs.forEach(d => { next[d.id] = { ...d.data(), id: d.id }; });
        if (c === "tasks") for (const id in pend) if (next[id]) next[id] = { ...next[id], ...pend[id] };
        S[c] = next;
        if (first) { first = false; if (--waiting === 0) loaded = true; }
        render();
      }, err => { if (err?.code !== "revoked") toast("Sync stopped. Reload the page to reconnect."); });
    });
  }

  // ---------- UI state ----------
  const ui = Object.assign({ view: "tasks", nav: "today", showDone: true, calMonth: null, calDay: null }, lsGet(LS_UI) || {});
  ui.sel = null; ui.openFolds = new Set(); ui.showSubDone = false;
  if (["tasks", "calendar", "matrix"].includes(location.hash.slice(1))) ui.view = location.hash.slice(1);
  if (!["tasks", "calendar", "matrix"].includes(ui.view)) ui.view = "tasks";
  const saveUI = () => lsSet(LS_UI, { view: ui.view, nav: ui.nav, showDone: ui.showDone });

  // ---------- quick add parsing ----------
  const DOW = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
  const dowOf = w => DOW[w.slice(0, 3).toLowerCase()];
  const MONRE = "(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)";
  const monOf = w => ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"].indexOf(w.slice(0, 3).toLowerCase()) + 1;
  const FULLDAY = "(sunday|monday|tuesday|wednesday|thursday|friday|saturday)";
  const SHORTDAY = "(sun|mon|tues?|wed|thu(?:rs?)?|fri|sat)";
  function mdNext(M, D) {
    const y = new Date().getFullYear(); let s = ymd(new Date(y, M - 1, D));
    if (diffDays(s, today()) < -60) s = ymd(new Date(y + 1, M - 1, D)); return s;
  }
  function upcoming(dow, next) {
    const t0 = today(), cur = new Date().getDay();
    if (next) { const mon = addDays(t0, 7 - ((cur + 6) % 7)); return addDays(mon, (dow + 6) % 7); }
    return addDays(t0, (dow - cur + 7) % 7);
  }
  function parseQuick(raw) {
    const MK = "\u0001";
    let s = " " + raw + " ";
    const r = { tags: [], tokens: [] };
    const t0 = today();
    const take = (re, fn) => { const m = s.match(re); if (!m) return false; if (fn(m) === false) return false; s = s.replace(m[0], " " + MK + " "); return true; };
    s = s.replace(/\s#([^\s#!^]+)/g, (m, t) => { r.tags.push(t); r.tokens.push("#" + t); return " "; });
    s = s.replace(/\s!(high|hi|medium|med|low|lo|[123])(?=\s)/i, (m, v) => {
      v = v.toLowerCase(); r.priority = v.startsWith("h") || v === "1" ? 3 : v.startsWith("m") || v === "2" ? 2 : 1;
      r.tokens.push(PRI.find(p => p.v === r.priority).n + " priority"); return " ";
    });
    s = s.replace(/\s\^(\S+)/, (m, n) => { const l = all("lists").find(l => l.name.toLowerCase() === n.toLowerCase()); if (!l) return m; r.listId = l.id; r.tokens.push("List: " + l.name); return " "; });
    let evening = false;
    take(new RegExp("\\bevery\\s+(day|weekday|week|month|year|" + FULLDAY.slice(1, -1) + "|" + SHORTDAY.slice(1, -1) + ")\\b|\\b(daily|weekly|monthly|yearly|weekdays)\\b", "i"), m => {
      const w = (m[1] || m[2]).toLowerCase();
      if (w === "day" || w === "daily") r.repeat = "daily";
      else if (w.startsWith("weekday")) r.repeat = "weekdays";
      else if (w === "week" || w === "weekly") r.repeat = "weekly";
      else if (w === "month" || w === "monthly") r.repeat = "monthly";
      else if (w === "year" || w === "yearly") r.repeat = "yearly";
      else { r.repeat = "weekly"; r.due = upcoming(dowOf(w)); }
      r.tokens.push(REPEAT[r.repeat]);
    });
    if (!r.due) {
      take(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/, m => { r.due = ymd(new Date(+m[1], m[2] - 1, +m[3])); })
      || take(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?=\s)/, m => { if (+m[1] > 12 || +m[2] > 31) return false; r.due = mdNext(+m[1], +m[2]); })
      || take(new RegExp("\\b" + MONRE + "\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b", "i"), m => { r.due = mdNext(monOf(m[1]), +m[2]); })
      || take(new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+" + MONRE + "\\b", "i"), m => { r.due = mdNext(monOf(m[2]), +m[1]); })
      || take(/\b(?:the\s+)?day\s+after\s+tomorrow\b/i, () => { r.due = addDays(t0, 2); })
      || take(/\b(today|tonight|tomorrow|tmrw?)\b/i, m => { const w = m[1].toLowerCase(); r.due = w.startsWith("t") && w !== "today" && w !== "tonight" ? addDays(t0, 1) : t0; evening = w === "tonight"; })
      || take(/\bnext\s+week\b/i, () => { r.due = upcoming(1, true); })
      || take(/\bin\s+(\d{1,3})\s+days?\b/i, m => { r.due = addDays(t0, +m[1]); })
      || take(/\bin\s+(\d{1,2})\s+weeks?\b/i, m => { r.due = addDays(t0, 7 * m[1]); })
      || take(new RegExp("\\b(?:(next|this)\\s+)?" + FULLDAY + "\\b", "i"), m => { r.due = upcoming(dowOf(m[2]), /next/i.test(m[1] || "")); })
      || take(new RegExp("\\b(next|this|on|by)\\s+" + SHORTDAY + "\\b", "i"), m => { r.due = upcoming(dowOf(m[2]), /next/i.test(m[1])); });
    }
    const setTime = (h, mi) => { if (h > 23 || mi > 59) return false; r.time = `${pad(h)}:${pad(mi)}`; if (!r.due) r.due = t0; };
    take(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)(?=[\s,.]|$)/i, m => {
      let h = +m[1]; if (h > 12 || h === 0) return false;
      const pm = /p/i.test(m[3]); if (pm && h < 12) h += 12; if (!pm && h === 12) h = 0;
      return setTime(h, +(m[2] || 0));
    })
    || take(/\b(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)\b/, m => { let h = +m[1]; if (evening && h < 12) h += 12; return setTime(h, +m[2]); })
    || take(/\b(?:at\s+)?(noon|midnight)\b/i, m => setTime(/noon/i.test(m[1]) ? 12 : 0, 0))
    || (evening && take(/\bat\s+(\d{1,2})\b/i, m => { const h = +m[1]; return h >= 1 && h <= 11 ? setTime(h + 12, 0) : false; }));
    if (r.repeat && !r.due) r.due = t0;
    if (r.due) r.tokens.unshift(fmtDue({ due: r.due, time: r.time }));
    s = s.replace(new RegExp("\\b(on|at|by|due|for|in)\\s*" + MK, "gi"), MK).split(MK).join(" ");
    r.title = s.replace(/\s+/g, " ").trim();
    return r;
  }
  function createTask(raw, defaults = {}) {
    const p = parseQuick(raw); if (!p.title) { toast("Type a name for the task."); return null; }
    const t = { id: uid(), title: p.title, notes: "", listId: p.listId || defaults.listId || "inbox",
      due: p.due ?? defaults.due ?? null, time: p.time || null, priority: p.priority ?? defaults.priority ?? 0,
      tags: [...new Set([...(defaults.tags || []), ...p.tags])], subtasks: [], repeat: p.repeat || "",
      done: false, doneAt: null, created: Date.now() };
    save("tasks", t); return t;
  }

  // ---------- nav model ----------
  const SMART = [["inbox", "Inbox", "inbox"], ["today", "Today", "today"], ["tomorrow", "Tomorrow", "tomorrow"], ["week", "Next 7 Days", "week"], ["all", "All Tasks", "all"]];
  function navInfo(key) {
    const s = SMART.find(x => x[0] === key); if (s) return { name: s[1] };
    if (key === "done") return { name: "Completed" };
    if (key.startsWith("list:")) { const l = S.lists[key.slice(5)]; return l ? { name: l.name, color: l.color } : null; }
    if (key.startsWith("tag:")) return { name: "#" + key.slice(4) };
    if (key.startsWith("group:")) { const g = key.slice(6); return all("lists").some(l => l.group === g) ? { name: g } : null; }
    return null;
  }
  function basePred(key) {
    const t0 = today();
    if (key === "inbox") return t => (t.listId || "inbox") === "inbox";
    if (key === "today") return t => t.due && t.due <= t0;
    if (key === "tomorrow") return t => t.due === addDays(t0, 1);
    if (key === "week") return t => t.due && t.due <= addDays(t0, 6);
    if (key === "all" || key === "done") return () => true;
    if (key.startsWith("list:")) { const id = key.slice(5); return t => t.listId === id; }
    if (key.startsWith("tag:")) { const g = key.slice(4); return t => (t.tags || []).includes(g); }
    if (key.startsWith("group:")) { const ids = new Set(all("lists").filter(l => l.group === key.slice(6)).map(l => l.id)); return t => ids.has(t.listId); }
    return () => false;
  }
  function navDefaults(key) {
    const t0 = today();
    if (key === "today" || key === "week") return { due: t0 };
    if (key === "tomorrow") return { due: addDays(t0, 1) };
    if (key.startsWith("list:")) return { listId: key.slice(5) };
    if (key.startsWith("tag:")) return { tags: [key.slice(4)] };
    return {};
  }
  function weekStartFor(key) {
    if (key.startsWith("list:")) return S.lists[key.slice(5)]?.weekStart || null;
    if (key.startsWith("group:")) return all("lists").filter(l => l.group === key.slice(6) && l.weekStart).map(l => l.weekStart).sort()[0] || null;
    return null;
  }
  const sortTasks = (a, b) => (a.due || "9999").localeCompare(b.due || "9999") || (a.time || "99").localeCompare(b.time || "99") || (b.priority || 0) - (a.priority || 0) || (a.created || 0) - (b.created || 0);
  function groupOf(t) {
    if (!t.due) return "none";
    const d = diffDays(t.due, today());
    return d < 0 ? "overdue" : d === 0 ? "today" : d === 1 ? "tomorrow" : d <= 7 ? "week" : "later";
  }
  const GROUPS = [["overdue", "Overdue"], ["today", "Today"], ["tomorrow", "Tomorrow"], ["week", "Next 7 days"], ["later", "Later"], ["none", "No date"]];

  // ---------- render ----------
  function render(opts = {}) {
    $("#app").dataset.view = ui.view;
    renderRail();
    $$(".view").forEach(v => v.hidden = v.id !== "view-" + ui.view);
    $("#side").classList.toggle("hidden-wide", ui.view !== "tasks");
    renderSide();
    if (ui.view === "tasks") renderTasks();
    if (ui.view === "calendar") renderCalendar();
    if (ui.view === "matrix") renderMatrix();
    if (!opts.skipDetail) renderDetail();
    const hasDetail = ["tasks", "calendar", "matrix"].includes(ui.view);
    $("#detail").hidden = !hasDetail;
    $("#app").classList.toggle("detail-open", hasDetail && !!S.tasks[ui.sel]);
    $("#scrim").hidden = !$("#app").classList.contains("side-open");
  }

  function renderRail() {
    const items = { tasks: "Tasks", calendar: "Calendar", matrix: "Matrix" };
    for (const k in items) {
      const b = $("#go-" + k);
      b.innerHTML = ic(k, 21) + `<span>${items[k]}</span>`;
      if (ui.view === k) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    }
  }

  function renderSide() {
    const open = all("tasks").filter(t => !t.done);
    const cnt = key => { const p = basePred(key); return open.filter(p).length; };
    const row = (key, icon, name, extra = "") => `<div class="nav-row ${ui.nav === key && ui.view === "tasks" ? "active" : ""}">
      <button class="nav-item" data-nav="${esc(key)}">${icon}<span class="nm">${esc(name)}</span><span class="count">${cnt(key) || ""}</span></button>${extra}</div>`;
    const lists = all("lists").sort((a, b) => (a.order || 0) - (b.order || 0) || (a.created || 0) - (b.created || 0));
    const plain = lists.filter(l => !l.group);
    const groups = [...new Set(lists.filter(l => l.group).map(l => l.group))];
    const listRow = l => row("list:" + l.id, `<span class="dot" style="background:${l.color}"></span>`, l.name, `<button class="row-edit" data-list-edit="${l.id}" aria-label="Edit list ${esc(l.name)}">${ic("edit", 14)}</button>`);
    const tags = [...new Set(all("tasks").flatMap(t => t.tags || []))].sort();
    const hasEx = COLLS.some(c => all(c).some(x => x.example));
    $("#side").innerHTML =
      `<div class="brand"><i></i>小吉罐頭的賺錢日記</div>` +
      SMART.map(([k, n, i]) => row(k, ic(i), n)).join("") +
      groups.map(g => `<div class="side-h"><button class="side-link ${ui.nav === "group:" + g && ui.view === "tasks" ? "active" : ""}" data-nav="group:${esc(g)}" title="Show all ${esc(g)} tasks by week">${esc(g.toUpperCase())}</button><span class="count num">${cnt("group:" + g) || ""}</span></div>` + lists.filter(l => l.group === g).map(listRow).join("")).join("") +
      `<div class="side-h"><span>LISTS</span><button class="icon-btn" id="add-list" aria-label="New list">${ic("plus", 16)}</button></div>` +
      (plain.length ? plain.map(listRow).join("")
        : `<div class="muted" style="padding:4px 10px;font-size:12.5px">${loaded ? "Press + to create a list" : "Loading…"}</div>`) +
      (tags.length ? `<div class="side-h"><span>TAGS</span></div>` + tags.map(g => row("tag:" + g, ic("tag", 16), g)).join("") : "") +
      `<div style="height:8px"></div><div class="nav-row ${ui.nav === "done" && ui.view === "tasks" ? "active" : ""}"><button class="nav-item" data-nav="done">${ic("done")}<span class="nm">Completed</span></button></div>` +
      (hasEx ? `<div class="example-note"><span>You're looking at sample data. Edit it freely, or clear it all at once.</span><button id="clear-ex">Clear sample data</button></div>` : "") +
      `<div class="sync">${esc(syncNote)}</div>`;
  }

  function taskRow(t, o = {}) {
    const sub = t.subtasks || [], sd = sub.filter(s => s.done).length;
    const l = o.showList && t.listId && t.listId !== "inbox" ? S.lists[t.listId] : null;
    const dd = t.due ? diffDays(t.due, today()) : null;
    const meta = [];
    if (sub.length) meta.push(`<span>${ic("sub", 12)}${sd}/${sub.length}</span>`);
    if (t.notes) meta.push(`<span title="Has notes">${ic("note", 12)}</span>`);
    (t.tags || []).forEach(g => meta.push(`<span class="chip-tag">#${esc(g)}</span>`));
    if (l) meta.push(`<span><i class="dot" style="background:${l.color};width:7px;height:7px;margin:0"></i>${esc(l.name)}</span>`);
    const dueTxt = t.due && !o.hideDate ? fmtDue(t) : t.time ? fmtTime(t.time) : "";
    return `<div class="task ${t.done ? "is-done" : ""} ${ui.sel === t.id ? "sel" : ""}" data-task="${t.id}" ${o.drag ? 'draggable="true"' : ""}>
      <button class="cb" style="--pc:${priColor(t.priority)}" data-check="${t.id}" aria-label="${t.done ? "Mark as not done" : "Complete"}: ${esc(t.title)}">${CHECK}</button>
      <div style="min-width:0"><div class="task-title">${esc(t.title)}</div>${meta.length ? `<div class="task-meta">${meta.join("")}</div>` : ""}</div>
      <div class="task-right">${t.repeat ? `<span title="${REPEAT[t.repeat]}">${ic("repeat", 13)}</span>` : ""}${dueTxt ? `<span class="due ${!t.done && dd < 0 ? "late" : !t.done && dd === 0 ? "today" : ""}">${esc(dueTxt)}</span>` : ""}<button class="task-del" data-del-task="${t.id}" title="Delete task" aria-label="Delete ${esc(t.title)}">${ic("trash", 15)}</button></div>
    </div>`;
  }
  const emptyBox = (icon, msg) => `<div class="empty">${ic(icon, 48, 1.4)}<div>${loaded ? msg : "Loading…"}</div></div>`;

  let lastNav = null;
  function renderTasks() {
    if (!navInfo(ui.nav)) ui.nav = "today";
    const info = navInfo(ui.nav);
    $("#list-title").innerHTML = (info.color ? `<span class="dot" style="background:${info.color};display:inline-block;margin:0 8px 0 0"></span>` : "") + esc(info.name);
    $("#toggle-done").innerHTML = ic("eye");
    $("#toggle-done").setAttribute("aria-pressed", ui.showDone);
    $("#toggle-done").hidden = ui.nav === "done";
    $("#composer").hidden = ui.nav === "done";
    const pred = basePred(ui.nav);
    if (ui.nav !== lastNav) { lastNav = ui.nav; compReset(false); }
    else if (!comp.open) compReset(false);
    else { const v = $("#c-list").value; $("#c-list").innerHTML = listOptions(v); $("#c-list").value = v; }
    $("#tag-opts").innerHTML = [...new Set([...COURSE_TAGS, ...allTags()])].map(g => `<option value="${esc(g)}"></option>`).join("");
    const showList = !ui.nav.startsWith("list:");
    const ws = weekStartFor(ui.nav);
    let html = "";
    if (ws) html = renderWeeks(pred, ws, showList);
    else if (ui.nav === "done") {
      const ds = all("tasks").filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
      const byDay = {};
      ds.forEach(t => { const k = t.doneAt ? ymd(new Date(t.doneAt)) : "earlier"; (byDay[k] = byDay[k] || []).push(t); });
      html = Object.keys(byDay).map(k => `<div class="group"><div class="group-h">${k === today() ? "Today" : k === addDays(today(), -1) ? "Yesterday" : k === "earlier" ? "Earlier" : fmtMD(k)} <span class="n">${byDay[k].length}</span></div>${byDay[k].map(t => taskRow(t, { showList })).join("")}</div>`).join("")
        || emptyBox("done", "No completed tasks yet.");
    } else {
      const open = all("tasks").filter(t => !t.done && pred(t)).sort(sortTasks);
      const groups = {}; open.forEach(t => (groups[groupOf(t)] = groups[groupOf(t)] || []).push(t));
      html = GROUPS.filter(([k]) => groups[k]).map(([k, n]) => `<div class="group"><div class="group-h ${k === "overdue" ? "late" : ""}">${n} <span class="n">${groups[k].length}</span></div>${groups[k].map(t => taskRow(t, { showList })).join("")}</div>`).join("");
      if (!open.length) html = emptyBox("tasks", ui.nav === "today" ? "All done for today. Add a task above. You can type dates like “tomorrow 3pm” or tags like “#work”." : "Nothing here yet. Add a task above.");
      const done = all("tasks").filter(t => t.done && pred(t)).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0)).slice(0, 30);
      if (done.length && ui.showDone) html += `<div class="group"><div class="group-h">Completed <span class="n">${done.length}</span></div>${done.map(t => taskRow(t, { showList })).join("")}</div>`;
    }
    $("#task-list").innerHTML = html;
  }

  function renderWeeks(pred, ws, showList) {
    const t0 = today(), ts = all("tasks").filter(t => pred(t) && (ui.showDone || !t.done));
    const nowWk = t0 >= ws ? Math.floor(diffDays(t0, ws) / 7) + 1 : 0;
    const groups = {};
    ts.forEach(t => { const k = !t.due ? 9999 : t.due < ws ? 0 : Math.floor(diffDays(t.due, ws) / 7) + 1; (groups[k] = groups[k] || []).push(t); });
    const keys = Object.keys(groups).map(Number).sort((a, b) => a - b);
    if (!keys.length) return emptyBox("tasks", "No tasks yet. Add one above, for example “Read chapter 2 next fri”.");
    return keys.map(k => {
      const list = groups[k].sort((a, b) => a.done - b.done || sortTasks(a, b));
      const openT = list.filter(t => !t.done), doneT = list.filter(t => t.done), fk = ui.nav + "|" + k, exp = ui.openFolds.has(fk);
      const done = list.filter(t => t.done).length;
      let label;
      if (k === 9999) label = "No date";
      else if (k === 0) label = "Before week 1";
      else { const a = addDays(ws, (k - 1) * 7), b = addDays(a, 6); label = `Week ${k} <span class="range">· ${fmtMD(a)} – ${fmtMD(b)}</span>`; }
      const late = k !== 9999 && k < nowWk && done < list.length;
      const allDone = doneT.length === list.length;
      return `<div class="group ${k < nowWk && !late ? "past" : ""}"><div class="group-h ${k === nowWk ? "now" : late ? "late" : allDone ? "alldone" : ""}">${label}${k === nowWk ? ' <span class="now-tag">This week</span>' : ""}<span class="pill">${done}/${list.length}</span></div>${openT.map(t => taskRow(t, { showList })).join("")}${doneT.length ? `<button class="done-fold" data-fold="${esc(fk)}" aria-expanded="${exp}"><span class="ar">${exp ? "▾" : "▸"}</span>${allDone ? "All done" : "Completed"} · ${doneT.length}</button>${exp ? doneT.map(t => taskRow(t, { showList })).join("") : ""}` : ""}</div>`;
    }).join("");
  }

  const subRow = s => `<div class="sub ${s.done ? "done" : ""}"><button class="cb ${s.done ? "on" : ""}" data-sub-check="${s.id}" aria-label="${s.done ? "Uncheck" : "Check"} subtask">${CHECK}</button><input type="text" id="sub-${s.id}" data-sub-text="${s.id}" value="${esc(s.t)}" aria-label="Subtask"><button class="icon-btn" data-sub-del="${s.id}" aria-label="Delete subtask">${ic("x", 14)}</button></div>`;
  function renderDetail(force) {
    const el = $("#detail"), t = S.tasks[ui.sel];
    if (!t) { el.dataset.id = ""; el.innerHTML = `<div class="d-empty">${ic("tasks", 54, 1.3)}<div>Select a task to edit its date, subtasks and tags.</div></div>`; return; }
    const a = document.activeElement;
    if (!force && el.dataset.id === t.id && el.contains(a) && a.matches('input[type="text"], textarea')) return;
    el.dataset.id = t.id;
    const subs = t.subtasks || [], sd = subs.filter(s => s.done).length;
    const lists = all("lists");
    const created = t.created ? new Date(t.created) : null;
    el.innerHTML = `<div class="d-wrap">
      <div class="d-top">
        <button class="icon-btn d-back" data-close-detail aria-label="Close details">${ic("back")}</button>
        <button class="cb ${t.done ? "on" : ""}" style="--pc:${priColor(t.priority)}" data-check="${t.id}" aria-label="${t.done ? "Mark as not done" : "Complete task"}">${CHECK}</button>
        <input type="date" id="d-due" value="${t.due || ""}" aria-label="Date">
        <input type="time" id="d-time" value="${t.time || ""}" ${t.due ? "" : "disabled"} aria-label="Time">
        <span class="grow"></span>
        <div class="prio-pick" role="group" aria-label="Priority">${PRI.map(p => `<button data-prio="${p.v}" aria-pressed="${(t.priority || 0) === p.v}" title="${p.n} priority" aria-label="${p.n} priority" style="--pc:${p.c}">${ic("flag", 17, 2)}</button>`).join("")}</div>
      </div>
      <input type="text" id="d-title" class="d-title" value="${esc(t.title)}" maxlength="200" aria-label="Task name">
      <textarea id="d-notes" class="d-notes" placeholder="Notes, links, details…" aria-label="Notes">${esc(t.notes || "")}</textarea>
      <div class="d-sec">
        <div class="d-label"><span>SUBTASKS</span><span class="num">${subs.length ? `${sd}/${subs.length}` : ""}</span></div>
        ${subs.length ? `<div class="prog"><i style="width:${Math.round(sd / subs.length * 100)}%"></i></div>` : ""}
        <div>${subs.filter(s => !s.done).map(subRow).join("")}</div>
        ${sd ? `<button class="done-fold" data-subfold aria-expanded="${ui.showSubDone}"><span class="ar">${ui.showSubDone ? "▾" : "▸"}</span>Completed · ${sd}</button>${ui.showSubDone ? `<div>${subs.filter(s => s.done).map(subRow).join("")}</div>` : ""}` : ""}
        <input type="text" class="line-input" id="d-sub-new" placeholder="+ Add a subtask, press Enter" aria-label="Add a subtask">
      </div>
      <div class="d-sec">
        <div class="d-label">TAGS</div>
        <div class="tags-edit">${(t.tags || []).map(g => `<span class="tag-chip">#${esc(g)}<button data-tag-del="${esc(g)}" aria-label="Remove tag ${esc(g)}">${ic("x", 12)}</button></span>`).join("")}<input type="text" id="d-tag-new" list="tag-opts" placeholder="Type a tag, press Enter" aria-label="Add a tag"></div>
      </div>
      <div class="d-grid">
        <div class="field"><label for="d-list">List</label><select id="d-list"><option value="inbox">Inbox</option>${lists.filter(l => !l.group).map(l => `<option value="${l.id}" ${t.listId === l.id ? "selected" : ""}>${esc(l.name)}</option>`).join("")}${[...new Set(lists.filter(l => l.group).map(l => l.group))].map(g => `<optgroup label="${esc(g)}">${lists.filter(l => l.group === g).map(l => `<option value="${l.id}" ${t.listId === l.id ? "selected" : ""}>${esc(l.name)}</option>`).join("")}</optgroup>`).join("")}</select></div>
        <div class="field"><label for="d-repeat">Repeat</label><select id="d-repeat">${Object.entries(REPEAT).map(([k, n]) => `<option value="${k}" ${(t.repeat || "") === k ? "selected" : ""}>${n}</option>`).join("")}</select></div>
      </div>
      <div class="d-foot">
        <span class="muted">${created ? `Created ${MO[created.getMonth()]} ${created.getDate()}` : ""}${t.example ? " · Sample" : ""}</span>
        <div class="acts"><button class="btn danger" id="d-del">${ic("trash", 15)}Delete</button></div>
      </div>
    </div>`;
    autoGrow($("#d-notes"));
  }
  function autoGrow(ta) { if (!ta) return; ta.style.height = "auto"; ta.style.height = Math.max(70, ta.scrollHeight) + "px"; }

  // ---------- calendar ----------
  function renderCalendar() {
    const t0 = today();
    if (!ui.calMonth) ui.calMonth = t0.slice(0, 7);
    if (!ui.calDay) ui.calDay = t0;
    const [Y, M] = ui.calMonth.split("-").map(Number);
    $("#cal-title").textContent = `${MONTHS[M - 1]} ${Y}`;
    $("#cal-prev").innerHTML = ic("left"); $("#cal-next").innerHTML = ic("right");
    const first = new Date(Y, M - 1, 1), start = new Date(Y, M - 1, 1 - first.getDay());
    const byDay = {};
    all("tasks").forEach(t => { if (t.due) (byDay[t.due] = byDay[t.due] || []).push(t); });
    let html = WD.map(w => `<div class="cal-wd">${w}</div>`).join("");
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const k = ymd(d), ts = (byDay[k] || []).sort((a, b) => a.done - b.done || sortTasks(a, b));
      html += `<div class="cell ${d.getMonth() !== M - 1 ? "other" : ""} ${k === t0 ? "today" : ""} ${k === ui.calDay ? "picked" : ""}" data-day="${k}" tabindex="0" role="button" aria-label="${fmtMD(k)}, ${plural(ts.length, "task")}">
        <span class="dn">${d.getDate()}</span>
        ${ts.slice(0, 3).map(t => `<span class="cchip ${t.done ? "done" : ""}" style="--pc:${priColor(t.priority)}" data-task="${t.id}">${t.time ? fmtTime(t.time).replace(":00", "") + " " : ""}${esc(t.title)}</span>`).join("")}
        ${ts.length > 3 ? `<span class="cmore">+${ts.length - 3} more</span>` : ""}
        <span class="cdots">${ts.slice(0, 4).map(t => `<i style="--pc:${t.done ? "var(--p0)" : priColor(t.priority)}"></i>`).join("")}</span>
      </div>`;
    }
    $("#cal-grid").innerHTML = html;
    const d = parseD(ui.calDay);
    $("#agenda-title").textContent = `${["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;
    $("#cal-qa").placeholder = `Add a task to ${fmtMD(ui.calDay)}`;
    const ts = (byDay[ui.calDay] || []).sort((a, b) => a.done - b.done || sortTasks(a, b));
    $("#agenda-list").innerHTML = ts.length ? ts.map(t => taskRow(t, { showList: true, hideDate: true })).join("") : `<div class="muted" style="padding:8px 10px">${loaded ? "Nothing scheduled for this day." : "Loading…"}</div>`;
    $$("#view-calendar .qa-ic").forEach(e => e.innerHTML = ic("plus", 16, 2.2));
  }

  // ---------- matrix ----------
  function renderMatrix() {
    const open = all("tasks").filter(t => !t.done).sort(sortTasks);
    [3, 2, 1, 0].forEach(p => {
      const ts = open.filter(t => (t.priority || 0) === p);
      $(`[data-qlist="${p}"]`).innerHTML = ts.length ? ts.map(t => taskRow(t, { showList: true, drag: true })).join("") : `<div class="muted" style="padding:8px;font-size:12.5px">${loaded ? "No tasks" : "Loading…"}</div>`;
      $(`[data-qcount="${p}"]`).textContent = ts.length;
    });
  }

  // ---------- actions ----------
  function select(id) {
    if (ui.sel && ui.sel !== id) flush(ui.sel);
    ui.sel = id; $("#app").classList.remove("side-open"); render();
  }
  function toggleDone(id) {
    const t = S.tasks[id]; if (!t) return;
    if (!t.done && t.repeat && t.due) {
      const nd = nextDue(t.due, t.repeat);
      save("tasks", { ...t, id: uid(), done: true, doneAt: Date.now(), repeat: "", subtasks: (t.subtasks || []).map(s => ({ ...s, done: true })) });
      patchTask(id, { due: nd, subtasks: (t.subtasks || []).map(s => ({ ...s, done: false })) });
      toast(`Done. Next one is ${fmtMD(nd)}.`);
    } else if (!t.done) {
      patchTask(id, { done: true, doneAt: Date.now() });
      toast(`Completed “${t.title}”`, "Undo", () => patchTask(id, { done: false, doneAt: null }));
    } else patchTask(id, { done: false, doneAt: null });
  }

  document.addEventListener("click", e => {
    const tgt = e.target;
    const go = tgt.closest("[data-go]");
    if (go) { ui.view = go.dataset.go; saveUI(); $("#app").classList.remove("side-open"); render(); $("#main").scrollTop = 0; return; }
    const nav = tgt.closest("[data-nav]");
    if (nav) { ui.nav = nav.dataset.nav; ui.view = "tasks"; saveUI(); $("#app").classList.remove("side-open"); render(); return; }
    if (tgt.closest("[data-open-side]")) { $("#app").classList.add("side-open"); render({ skipDetail: true }); return; }
    if (tgt.closest("#scrim")) { $("#app").classList.remove("side-open"); render({ skipDetail: true }); return; }
    const chk = tgt.closest("[data-check]");
    if (chk) {
      e.stopPropagation();
      const row = chk.closest(".task");
      if (row && !row.classList.contains("is-done")) { row.classList.add("is-done"); setTimeout(() => toggleDone(chk.dataset.check), 260); }
      else toggleDone(chk.dataset.check);
      return;
    }
    const fold = tgt.closest("[data-fold]");
    if (fold) { const k = fold.dataset.fold; ui.openFolds.has(k) ? ui.openFolds.delete(k) : ui.openFolds.add(k); render({ skipDetail: true }); return; }
    const dt = tgt.closest("[data-del-task]");
    if (dt) {
      e.stopPropagation();
      const id = dt.dataset.delTask, t = S.tasks[id]; if (!t) return;
      clearTimeout(pendT[id]); delete pend[id]; if (ui.sel === id) ui.sel = null;
      remove("tasks", id);
      toast(`Deleted “${t.title}”`, "Undo", () => save("tasks", t));
      return;
    }
    const task = tgt.closest("[data-task]");
    if (task) { e.stopPropagation(); select(task.dataset.task); return; }
    const cell = tgt.closest("[data-day]:not([data-hcheck])");
    if (cell) { ui.calDay = cell.dataset.day; render({ skipDetail: true }); return; }
    if (tgt.closest("[data-close-detail]")) { flush(ui.sel); ui.sel = null; render(); return; }
    if (tgt.closest("[data-close]")) { tgt.closest("dialog").close(); return; }
    if (tgt.closest("#add-list")) { openList(null); return; }
    const le = tgt.closest("[data-list-edit]"); if (le) { openList(le.dataset.listEdit); return; }
    if (tgt.closest("#clear-ex")) { clearExamples(); return; }
    if (tgt.closest("#toggle-done")) { ui.showDone = !ui.showDone; saveUI(); render({ skipDetail: true }); return; }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && ui.sel && !document.querySelector("dialog[open]")) { flush(ui.sel); ui.sel = null; render(); }
    if ((e.key === "Enter" || e.key === " ") && e.target.matches(".cell")) { e.preventDefault(); ui.calDay = e.target.dataset.day; render({ skipDetail: true }); }
  });

  // composer
  const qa = $("#qa");
  $("#qa-ic").innerHTML = ic("plus", 16, 2.2);
  const COURSE_TAGS = ["homework", "reading", "lecture", "exam", "quiz", "project"];
  const comp = { open: false, touched: {}, priority: 0, manualTags: [], removedTags: [], parsedTags: [], defTags: [] };
  function compDefaults() {
    const d = navDefaults(ui.nav);
    let listId = d.listId || "inbox";
    if (ui.nav.startsWith("group:")) { const first = all("lists").filter(l => l.group === ui.nav.slice(6)).sort((a, b) => (a.order || 0) - (b.order || 0))[0]; if (first) listId = first.id; }
    return { due: d.due || "", priority: 0, listId, tags: d.tags || [] };
  }
  const compTags = () => [...new Set([...comp.defTags, ...comp.parsedTags, ...comp.manualTags])].filter(t => !comp.removedTags.includes(t));
  function listOptions(sel) {
    const lists = all("lists").sort((a, b) => (a.order || 0) - (b.order || 0) || (a.created || 0) - (b.created || 0));
    const o = l => `<option value="${l.id}" ${l.id === sel ? "selected" : ""}>${esc(l.name)}</option>`;
    return `<option value="inbox">Inbox</option>` + lists.filter(l => !l.group).map(o).join("") +
      [...new Set(lists.filter(l => l.group).map(l => l.group))].map(g => `<optgroup label="${esc(g)}">${lists.filter(l => l.group === g).map(o).join("")}</optgroup>`).join("");
  }
  function allTags() { return [...new Set(all("tasks").flatMap(t => t.tags || []))].sort(); }
  function renderCompPrio() {
    $("#c-prio").innerHTML = PRI.map(p => `<button type="button" data-cprio="${p.v}" aria-pressed="${comp.priority === p.v}" title="${p.n} priority" aria-label="${p.n} priority" style="--pc:${p.c}">${ic("flag", 17, 2)}</button>`).join("");
  }
  function renderCompTags() {
    const sel = compTags();
    const l = S.lists[$("#c-list").value];
    const sug = [...new Set([...(l && l.weekStart ? COURSE_TAGS : []), ...allTags()])].filter(t => !sel.includes(t)).slice(0, 14);
    const keep = $("#c-tag-new")?.value || "";
    $("#c-tags").innerHTML = sel.map(g => `<span class="tag-chip">#${esc(g)}<button type="button" data-ctag-del="${esc(g)}" aria-label="Remove tag ${esc(g)}">${ic("x", 12)}</button></span>`).join("") +
      sug.map(g => `<button type="button" class="tag-sug" data-ctag-add="${esc(g)}">+ ${esc(g)}</button>`).join("") +
      `<input type="text" id="c-tag-new" list="tag-opts" placeholder="New tag, press Enter" aria-label="New tag">`;
    $("#c-tag-new").value = keep;
  }
  function hint(p) {
    if (!qa.value.trim()) { $("#qa-hint").innerHTML = `<span>Tip: you can also type dates and tags, e.g. “next fri 3pm #reading !high”</span>`; return; }
    $("#qa-hint").innerHTML = p.tokens.length ? `<span>Detected:</span>` + p.tokens.map(t => `<span class="tok">${esc(t)}</span>`).join("") : `<span>Press Enter to add</span>`;
  }
  function compSync() {
    const p = parseQuick(qa.value || ""), d = compDefaults();
    if (!comp.touched.due) $("#c-due").value = p.due || d.due;
    if (!comp.touched.time) $("#c-time").value = p.time || "";
    if (!comp.touched.priority) comp.priority = p.priority ?? d.priority;
    if (!comp.touched.listId) $("#c-list").value = p.listId || d.listId;
    if (!comp.touched.repeat) $("#c-repeat").value = p.repeat || "";
    comp.parsedTags = p.tags; comp.defTags = d.tags;
    renderCompPrio(); renderCompTags(); hint(p);
  }
  function compReset(keepOpen) {
    qa.value = ""; $("#c-notes").value = "";
    comp.touched = {}; comp.manualTags = []; comp.removedTags = [];
    $("#c-repeat").innerHTML = Object.entries(REPEAT).map(([k, n]) => `<option value="${k}">${n}</option>`).join("");
    $("#c-list").innerHTML = listOptions(compDefaults().listId);
    comp.open = keepOpen; $("#comp-body").hidden = !keepOpen;
    compSync();
  }
  function compOpen() { if (!comp.open) { comp.open = true; $("#comp-body").hidden = false; } }
  function compSubmit() {
    const p = parseQuick(qa.value);
    if (!p.title) { toast("Type a name for the task."); qa.focus(); return; }
    let due = $("#c-due").value || null; const time = $("#c-time").value || null, repeat = $("#c-repeat").value;
    if ((time || repeat) && !due) due = today();
    const t = { id: uid(), title: p.title, notes: $("#c-notes").value.trim(), listId: $("#c-list").value || "inbox", due, time,
      priority: comp.priority, tags: compTags(), subtasks: [], repeat, done: false, doneAt: null, created: Date.now() };
    save("tasks", t);
    toast(`Added “${t.title}”${t.due ? ", " + fmtDue(t) : ""}`);
    compReset(true); qa.focus();
  }
  qa.addEventListener("focus", compOpen);
  qa.addEventListener("input", () => { compOpen(); compSync(); });
  qa.addEventListener("keydown", e => { if (e.key === "Escape") { e.stopPropagation(); compReset(false); qa.blur(); } });
  $("#qa-form").addEventListener("submit", e => { e.preventDefault(); compSubmit(); });
  $("#c-add").addEventListener("click", compSubmit);
  $("#c-cancel").addEventListener("click", () => compReset(false));
  $("#c-due").addEventListener("change", () => { comp.touched.due = true; });
  $("#c-time").addEventListener("change", () => { comp.touched.time = true; if ($("#c-time").value && !$("#c-due").value) { $("#c-due").value = today(); comp.touched.due = true; } });
  $("#c-repeat").addEventListener("change", () => { comp.touched.repeat = true; });
  $("#c-list").addEventListener("change", () => { comp.touched.listId = true; renderCompTags(); });
  $("#comp-body").addEventListener("click", e => {
    const pb = e.target.closest("[data-cprio]"); if (pb) { comp.touched.priority = true; comp.priority = +pb.dataset.cprio; renderCompPrio(); return; }
    const td = e.target.closest("[data-ctag-del]");
    if (td) { const g = td.dataset.ctagDel; comp.manualTags = comp.manualTags.filter(x => x !== g); if (compTags().includes(g)) comp.removedTags.push(g); renderCompTags(); return; }
    const ta = e.target.closest("[data-ctag-add]");
    if (ta) { const g = ta.dataset.ctagAdd; comp.manualTags.push(g); comp.removedTags = comp.removedTags.filter(x => x !== g); renderCompTags(); }
  });
  $("#comp-body").addEventListener("keydown", e => {
    if (e.target.id === "c-tag-new" && e.key === "Enter" && !e.isComposing) {
      e.preventDefault();
      const g = e.target.value.trim().replace(/^#/, "").replace(/\s+/g, "-");
      if (g) { comp.manualTags.push(g); comp.removedTags = comp.removedTags.filter(x => x !== g); e.target.value = ""; renderCompTags(); $("#c-tag-new").focus(); }
    }
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); compSubmit(); }
  });
  $("#cal-qa-form").addEventListener("submit", e => {
    e.preventDefault(); const v = $("#cal-qa").value; if (!v.trim()) return;
    if (createTask(v, { due: ui.calDay })) $("#cal-qa").value = "";
  });
  $$("[data-qa-prio]").forEach(f => f.addEventListener("submit", e => {
    e.preventDefault(); const inp = f.querySelector("input"); if (!inp.value.trim()) return;
    if (createTask(inp.value, { priority: +f.dataset.qaPrio })) inp.value = "";
  }));
  $("#cal-prev").addEventListener("click", () => shiftMonth(-1));
  $("#cal-next").addEventListener("click", () => shiftMonth(1));
  $("#cal-today").addEventListener("click", () => { ui.calMonth = today().slice(0, 7); ui.calDay = today(); render({ skipDetail: true }); });
  function shiftMonth(n) { const [Y, M] = ui.calMonth.split("-").map(Number); ui.calMonth = ymd(new Date(Y, M - 1 + n, 1)).slice(0, 7); render({ skipDetail: true }); }

  // matrix drag
  let dragId = null;
  document.addEventListener("dragstart", e => { const t = e.target.closest?.(".task[draggable]"); if (t) { dragId = t.dataset.task; e.dataTransfer.effectAllowed = "move"; } });
  document.addEventListener("dragover", e => { const q = e.target.closest?.(".quad"); if (q && dragId) { e.preventDefault(); $$(".quad").forEach(x => x.classList.toggle("drag-over", x === q)); } });
  document.addEventListener("drop", e => { const q = e.target.closest?.(".quad"); $$(".quad").forEach(x => x.classList.remove("drag-over")); if (q && dragId) { e.preventDefault(); patchTask(dragId, { priority: +q.dataset.quad }); } dragId = null; });
  document.addEventListener("dragend", () => { $$(".quad").forEach(x => x.classList.remove("drag-over")); dragId = null; });

  // detail editing
  const det = $("#detail");
  det.addEventListener("input", e => {
    const id = ui.sel, t = S.tasks[id]; if (!t) return;
    if (e.target.id === "d-title") patchTask(id, { title: e.target.value }, 600);
    else if (e.target.id === "d-notes") { autoGrow(e.target); patchTask(id, { notes: e.target.value }, 700); }
    else if (e.target.dataset.subText) patchTask(id, { subtasks: (t.subtasks || []).map(s => s.id === e.target.dataset.subText ? { ...s, t: e.target.value } : s) }, 600);
  });
  det.addEventListener("focusout", e => {
    const t = S.tasks[ui.sel]; if (!t) return;
    if (e.target.id === "d-title" && !e.target.value.trim()) { e.target.value = "Untitled task"; patchTask(t.id, { title: "Untitled task" }); }
    else if (e.target.matches("#d-title, #d-notes, [data-sub-text]")) flush(t.id);
  });
  det.addEventListener("change", e => {
    const t = S.tasks[ui.sel]; if (!t) return;
    const v = e.target.value;
    if (e.target.id === "d-due") patchTask(t.id, { due: v || null, time: v ? t.time : null, repeat: v ? t.repeat : "" });
    else if (e.target.id === "d-time") patchTask(t.id, { time: v || null });
    else if (e.target.id === "d-list") patchTask(t.id, { listId: v });
    else if (e.target.id === "d-repeat") patchTask(t.id, { repeat: v, due: v && !t.due ? today() : t.due });
    else return;
    renderDetail(true);
  });
  det.addEventListener("click", e => {
    const t = S.tasks[ui.sel]; if (!t) return;
    if (e.target.closest("[data-subfold]")) { ui.showSubDone = !ui.showSubDone; renderDetail(true); return; }
    const p = e.target.closest("[data-prio]"); if (p) { patchTask(t.id, { priority: +p.dataset.prio }); renderDetail(true); return; }
    const sc = e.target.closest("[data-sub-check]"); if (sc) { patchTask(t.id, { subtasks: (t.subtasks || []).map(s => s.id === sc.dataset.subCheck ? { ...s, done: !s.done } : s) }); renderDetail(true); return; }
    const sx = e.target.closest("[data-sub-del]"); if (sx) { patchTask(t.id, { subtasks: (t.subtasks || []).filter(s => s.id !== sx.dataset.subDel) }); renderDetail(true); return; }
    const tx = e.target.closest("[data-tag-del]"); if (tx) { patchTask(t.id, { tags: (t.tags || []).filter(g => g !== tx.dataset.tagDel) }); renderDetail(true); return; }
    const del = e.target.closest("#d-del");
    if (del) {
      if (del.classList.contains("armed")) { const id = t.id; clearTimeout(pendT[id]); delete pend[id]; ui.sel = null; remove("tasks", id); toast("Task deleted"); }
      else { del.classList.add("armed"); del.innerHTML = ic("trash", 15) + "Confirm delete"; setTimeout(() => { if (del.isConnected) { del.classList.remove("armed"); del.innerHTML = ic("trash", 15) + "Delete"; } }, 3000); }
    }
  });
  det.addEventListener("keydown", e => {
    const t = S.tasks[ui.sel]; if (!t || e.key !== "Enter" || e.isComposing) return;
    if (e.target.id === "d-sub-new" && e.target.value.trim()) {
      e.preventDefault(); flush(t.id);
      patchTask(t.id, { subtasks: [...(S.tasks[t.id].subtasks || []), { id: uid(), t: e.target.value.trim(), done: false }] });
      renderDetail(true); $("#d-sub-new").focus();
    } else if (e.target.id === "d-tag-new" && e.target.value.trim()) {
      e.preventDefault(); flush(t.id);
      const g = e.target.value.trim().replace(/^#/, "").replace(/\s+/g, "-");
      if (g) patchTask(t.id, { tags: [...new Set([...(S.tasks[t.id].tags || []), g])] });
      renderDetail(true); $("#d-tag-new").focus();
    } else if (e.target.id === "d-title") { e.preventDefault(); e.target.blur(); }
  });

  document.title = "小吉罐頭的賺錢日記";

  // list dialog
  function colorPicker(box, cur, onPick) {
    box.innerHTML = COLORS.map(c => `<button type="button" style="background:${c}" data-c="${c}" aria-pressed="${c === cur}" aria-label="Color ${c}"></button>`).join("");
    box.onclick = e => { const b = e.target.closest("[data-c]"); if (b) { onPick(b.dataset.c); colorPicker(box, b.dataset.c, onPick); } };
  }
  function armBtn(btn, label, fn) {
    btn.onclick = () => { if (btn.classList.contains("armed")) fn(); else { btn.dataset.orig = btn.textContent; btn.classList.add("armed"); btn.textContent = label; } };
  }
  const resetArm = btn => { btn.classList.remove("armed"); if (btn.dataset.orig) btn.textContent = btn.dataset.orig; };
  let editList = null, listColor = COLORS[0];
  function openList(id) {
    editList = id ? S.lists[id] : null;
    $("#list-dlg-title").textContent = editList ? "Edit list" : "New list";
    $("#l-name").value = editList?.name || "";
    $("#l-group").value = editList ? editList.group || "" : (ui.nav.startsWith("group:") ? ui.nav.slice(6) : "");
    $("#l-week").value = editList ? editList.weekStart || "" : (ui.nav.startsWith("group:") ? weekStartFor(ui.nav) || "" : "");
    $("#group-opts").innerHTML = [...new Set(all("lists").map(l => l.group).filter(Boolean))].map(g => `<option value="${esc(g)}"></option>`).join("");
    listColor = editList?.color || COLORS[all("lists").length % COLORS.length];
    colorPicker($("#l-colors"), listColor, c => listColor = c);
    $("#l-del").hidden = !editList; resetArm($("#l-del"));
    $("#list-dlg").showModal(); $("#l-name").focus();
  }
  $("#list-form").addEventListener("submit", e => {
    e.preventDefault(); const name = $("#l-name").value.trim(); if (!name) return;
    const extra = { group: $("#l-group").value.trim(), weekStart: $("#l-week").value || null };
    const l = editList ? { ...editList, name, color: listColor, ...extra } : { id: uid(), name, color: listColor, created: Date.now(), order: all("lists").length, ...extra };
    save("lists", l); $("#list-dlg").close();
    if (!editList) { ui.nav = "list:" + l.id; ui.view = "tasks"; saveUI(); render(); }
  });
  armBtn($("#l-del"), "Confirm? Tasks move to Inbox", async () => {
    const id = editList.id; $("#list-dlg").close();
    if (ui.nav === "list:" + id) ui.nav = "inbox";
    for (const t of all("tasks").filter(t => t.listId === id)) await save("tasks", { ...t, listId: "inbox" });
    remove("lists", id); toast("List deleted");
  });
  async function clearExamples() {
    ui.sel = null;
    for (const c of COLLS) for (const x of all(c).filter(x => x.example)) await remove(c, x.id);
    toast("Sample data cleared");
  }

  // toast
  let toastT;
  function toast(msg, act, fn) {
    $("#toast-msg").textContent = msg;
    const b = $("#toast-act"); b.hidden = !act; b.textContent = act || ""; b.onclick = () => { $("#toast").hidden = true; fn && fn(); };
    $("#toast").hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $("#toast").hidden = true, 3200);
  }

  $$(".menu-btn").forEach(b => b.innerHTML = ic("menu", 20));
  compReset(false); render(); initStore();
})();
</script>
